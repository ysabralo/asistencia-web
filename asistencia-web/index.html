<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Asistencia Telecomunicaciones Movilnet v16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex overflow-hidden font-sans">

    <!-- LOGIN -->
    <div id="login-view" class="w-full h-full flex items-center justify-center bg-gray-900 absolute z-50 transition-opacity duration-500">
        <div class="bg-gray-800 border-2 border-blue-500 p-10 rounded-2xl shadow-2xl max-w-md w-full text-center">
            <div class="text-6xl mb-4">🏢</div>
            <h1 class="text-3xl font-bold mb-2">Control de Asistencia</h1>
            <p class="text-gray-400 mb-8">Ingrese sus credenciales para continuar</p>
            <input type="text" id="username" placeholder="👤 Usuario" class="w-full mb-4 px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            <input type="password" id="password" placeholder="🔒 Contraseña" class="w-full mb-8 px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            <button onclick="iniciarSesion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                INICIAR SESIÓN
            </button>
        </div>
    </div>

    <!-- INTERFAZ PRINCIPAL -->
    <div id="main-view" class="w-full h-full flex hidden">
        <div class="w-72 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-6 text-center border-b border-gray-700">
                <h2 class="text-xl font-bold mb-2">Panel de Control</h2>
                <p id="user-info" class="text-blue-400 font-semibold text-sm">👤 Usuario<br>👔 Rol</p>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="sidebar-buttons"></div>
            <div class="p-4 border-t border-gray-700">
                <button onclick="cerrarSesion()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <div class="flex-1 bg-gray-900 p-8 overflow-y-auto" id="content-area">
            <div class="text-center mb-10">
                <h1 id="dashboard-title" class="text-3xl font-bold text-blue-500 mb-4">🏠 Panel de Control</h1>
                <p id="dashboard-subtitle" class="text-lg text-gray-300">Cargando estado del sistema...</p>
            </div>
            <div id="dashboard-checklist" class="max-w-4xl mx-auto bg-gray-800 rounded-2xl border border-gray-700 p-8 shadow-xl hidden">
                <h3 class="text-xl font-semibold mb-6 border-b border-gray-700 pb-4">Estado Actual del Flujo de Trabajo Semanal:</h3>
                <div id="steps-container" class="space-y-6"></div>
                <div id="dashboard-alert" class="mt-8 text-center font-bold text-lg p-4 rounded-lg"></div>
            </div>
        </div>
    </div>

    <input type="file" id="file-upload" class="hidden" accept=".xlsx, .xls">

    <script>
        let currentUser = null;
        let currentRole = null;
        let systemState = null;

        // Listener seguro cuando carga el DOM
        document.addEventListener("DOMContentLoaded", () => {
            const pwdInput = document.getElementById('password');
            if (pwdInput) {
                pwdInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') window.iniciarSesion();
                });
            }
        });

        // Declaración global explícita para evitar errores de ámbito
        window.iniciarSesion = async function() {
            const user = document.getElementById('username').value.trim();
            const pwd = document.getElementById('password').value.trim();

            if (!user || !pwd) {
                return Swal.fire('Aviso', 'Por favor ingrese usuario y contraseña.', 'warning');
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pwd })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    currentUser = data.username;
                    currentRole = data.rol;
                    document.getElementById('user-info').innerHTML = `👤 ${currentUser}<br>👔 ${currentRole}`;
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('main-view').classList.remove('hidden');
                    evaluarEstadoSistema();
                } else {
                    Swal.fire('Error', data.detail || 'Credenciales incorrectas', 'error');
                }
            } catch (error) {
                console.error("Error de red:", error);
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            }
        };

        window.cerrarSesion = function() {
            Swal.fire({
                title: '¿Cerrar Sesión?',
                text: "¿Está seguro que desea salir de su cuenta?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, salir'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentUser = null;
                    currentRole = null;
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('main-view').classList.add('hidden');
                    document.getElementById('login-view').classList.remove('hidden');
                }
            });
        };

        async function evaluarEstadoSistema() {
            try {
                const response = await fetch('/api/estado-sistema');
                systemState = await response.json();
                renderSidebar();
                renderDashboard();
            } catch (error) {
                console.error("Error al obtener estado:", error);
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-buttons');
            sidebar.innerHTML = ''; 

            const state = systemState;
            const isOpen = state.semana_abierta;
            const hasTemplate = state.total_plantilla > 0;
            const isReady = isOpen && hasTemplate && state.faltantes === 0;

            const createBtn = (text, onClick, colorClass, isDisabled = false) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left font-bold py-3 px-4 rounded-lg transition-colors ${isDisabled ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : colorClass + ' text-white'}`;
                btn.innerHTML = text;
                btn.disabled = isDisabled;
                if (!isDisabled) btn.onclick = onClick;
                return btn;
            };

            sidebar.appendChild(createBtn('🏠 Panel de Inicio', evaluarEstadoSistema, 'bg-gray-700 hover:bg-gray-600'));

            if (currentRole !== "Recursos Humanos") {
                sidebar.appendChild(createBtn('1. Importar Semana (RRHH)', () => alert('En desarrollo'), 'bg-gray-700 hover:bg-gray-600'));
                sidebar.appendChild(createBtn('2. Cargar Plantilla (Excel)', dispararCargaPlantilla, 'bg-gray-700 hover:bg-gray-600', !isOpen));
                sidebar.appendChild(createBtn('3. Registro de Asistencia', () => alert('En desarrollo'), 'bg-gray-700 hover:bg-gray-600', !(isOpen && hasTemplate)));
                
                if (currentRole === "Unidad Intermedia" || currentRole === "Unidad Principal (Envío RRHH)") {
                    sidebar.appendChild(createBtn('4. Importar Sub-Unidades', () => alert('En desarrollo'), 'bg-purple-700 hover:bg-purple-600', !(isOpen && hasTemplate)));
                }

                sidebar.appendChild(createBtn('📊 Ver Reporte General', () => alert('En desarrollo'), 'bg-indigo-600 hover:bg-indigo-700', !(state.semana_activa || state.hay_historial)));

                if (currentRole === "Unidad Principal (Envío RRHH)") {
                    sidebar.appendChild(createBtn('5. Cierre y Envío a RRHH', () => alert('En desarrollo'), 'bg-red-600 hover:bg-red-700', !isReady));
                } else {
                    sidebar.appendChild(createBtn('5. Exportar a Superior', () => alert('En desarrollo'), 'bg-orange-600 hover:bg-orange-700', !isReady));
                }
            } else {
                sidebar.appendChild(createBtn('1. Importar Semana (RRHH)', () => alert('En desarrollo'), 'bg-gray-700 hover:bg-gray-600'));
                sidebar.appendChild(createBtn('📊 Ver Reporte General', () => alert('En desarrollo'), 'bg-indigo-600 hover:bg-indigo-700', !(state.semana_activa || state.hay_historial)));
                sidebar.appendChild(createBtn('Unificar Reportes (RRHH)', () => alert('En desarrollo'), 'bg-green-600 hover:bg-green-700'));
                sidebar.appendChild(createBtn('👥 Gestionar Usuarios', () => alert('En desarrollo'), 'bg-blue-600 hover:bg-blue-700'));
            }
        }

        function renderDashboard() {
            document.getElementById('dashboard-checklist').classList.remove('hidden');
            const title = document.getElementById('dashboard-title');
            const subtitle = document.getElementById('dashboard-subtitle');
            
            title.innerHTML = `🏠 Panel de Control: ${currentRole.toUpperCase()}`;

            if (currentRole === "Recursos Humanos") {
                subtitle.innerHTML = systemState.semana_activa 
                    ? `<span class="text-green-400 font-bold">Semana Activa: ${systemState.fecha_inicio} al ${systemState.fecha_fin}</span>`
                    : `<span class="text-red-400">No hay semana activa. Importe su archivo base para comenzar.</span>`;
                document.getElementById('dashboard-checklist').classList.add('hidden');
                return;
            }

            subtitle.innerHTML = "";
            const state = systemState;
            
            const step1 = state.semana_activa;
            const step2 = step1 && (state.total_plantilla > 0);
            const step3 = step2 && (state.faltantes === 0);
            const step4 = state.semana_cerrada;

            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            const createStepHTML = (num, text, isDone, isActive, extraText = "") => {
                let icon = isDone ? "✅" : (isActive ? "▶️" : "⏳");
                let textColor = isDone ? "text-green-500" : (isActive ? "text-blue-400" : "text-gray-500");
                let extraColor = extraText.includes('Faltan') ? "text-red-400" : "text-gray-400";
                
                return `
                    <div class="flex items-center justify-between p-4 bg-gray-900 rounded-xl border ${isActive ? 'border-blue-500' : 'border-gray-700'}">
                        <div class="flex items-center">
                            <span class="text-2xl mr-4">${icon}</span>
                            <span class="text-lg ${isActive ? 'font-bold' : ''} ${textColor}">Paso ${num}: ${text}</span>
                        </div>
                        ${extraText && (isActive || !isDone) ? `<span class="text-sm italic ${extraColor}">${extraText}</span>` : ''}
                    </div>
                `;
            };

            container.innerHTML += createStepHTML(1, "Importar Archivo de RRHH", step1, !step1);
            container.innerHTML += createStepHTML(2, "Verificar Plantilla Maestra", step2, step1 && !step2, step2 ? `(${state.total_plantilla} empleados)` : "");
            
            let txtFaltantes = "";
            if (step2 && !step3) txtFaltantes = `(⚠️ Faltan ${state.faltantes} trabajadores por reportar)`;
            else if (step3) txtFaltantes = "(Todos reportados)";
            
            container.innerHTML += createStepHTML(3, "Registrar y Consolidar Asistencia", step3, step2 && !step3, txtFaltantes);
            container.innerHTML += createStepHTML(4, "Cierre y Exportación Definitiva", step4, step3 && !step4);

            const alertBox = document.getElementById('dashboard-alert');
            if (!step1) {
                alertBox.className = "mt-8 text-center font-bold text-lg p-4 rounded-lg bg-red-900/50 text-red-400 border border-red-800";
                alertBox.innerHTML = "⛔ Sistema Bloqueado: Use el botón '1. Importar Semana (RRHH)' para iniciar.";
            } else if (!step2) {
                alertBox.className = "mt-8 text-center font-bold text-lg p-4 rounded-lg bg-yellow-900/50 text-yellow-400 border border-yellow-800";
                alertBox.innerHTML = "Semana habilitada. Cargue o verifique su Excel de plantilla con el botón 2.";
            } else if (!step3) {
                alertBox.className = "mt-8 text-center font-bold text-lg p-4 rounded-lg bg-blue-900/50 text-blue-400 border border-blue-800";
                alertBox.innerHTML = "Registro en curso. El botón de Exportar está bloqueado hasta que falten 0 trabajadores.";
            } else if (!step4) {
                alertBox.className = "mt-8 text-center font-bold text-lg p-4 rounded-lg bg-green-900/50 text-green-400 border border-green-800";
                alertBox.innerHTML = "✅ ¡Asistencia al 100%! Ya puede realizar el Cierre y Exportación.";
            } else {
                alertBox.className = "mt-8 text-center font-bold text-lg p-4 rounded-lg bg-green-900/50 text-green-400 border border-green-800";
                alertBox.innerHTML = "🔒 Semana Cerrada Exitosamente. Espere la nueva semana de RRHH.";
            }
        }

        window.dispararCargaPlantilla = function() {
            Swal.fire({
                title: 'Estructura de la Plantilla',
                html: `
                    <p class="text-sm mb-4">Asegúrese de que los encabezados estén exactamente en la fila 1 de su archivo Excel:</p>
                    <table class="w-full text-left text-sm mb-4 border-collapse border border-gray-600 text-white">
                        <tr class="bg-gray-700"><th class="border border-gray-600 p-2">A: ID_Empleado</th><th class="border border-gray-600 p-2">B: Origen</th><th class="border border-gray-600 p-2">C: Unidad</th></tr>
                        <tr><td class="border border-gray-600 p-2">P001234</td><td class="border border-gray-600 p-2">Propio</td><td class="border border-gray-600 p-2">Ventas</td></tr>
                        <tr><td class="border border-gray-600 p-2">P005678</td><td class="border border-gray-600 p-2">Sub-Unidad</td><td class="border border-gray-600 p-2">Almacén</td></tr>
                    </table>
                    <p class="text-xs text-yellow-500 italic">Escriba 'Propio' para su personal directo, o 'Sub-Unidad' para personal consolidado.</p>
                `,
                icon: 'info',
                showCancelButton: true,
                confirmButtonColor: '#27AE60',
                cancelButtonColor: '#7F8C8D',
                confirmButtonText: '✅ Entendido, Seleccionar Excel'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('file-upload').click();
                }
            });
        };

        document.getElementById('file-upload').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            Swal.fire({ title: 'Procesando...', text: 'Leyendo matriz de Excel', allowOutsideClick: false });
            Swal.showLoading();

            try {
                const response = await fetch('/api/cargar-plantilla', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    Swal.fire('¡Éxito!', data.mensaje, 'success');
                    evaluarEstadoSistema(); 
                } else {
                    Swal.fire('Error', data.detail, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'No se pudo subir el archivo', 'error');
            }
            
            e.target.value = '';
        });
    </script>
</body>
</html>
